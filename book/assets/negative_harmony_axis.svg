<text x="40" y="34" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="start" fill="#25282c" font-weight="700">Negative-harmony mirror for C: C/G polarity axis</text><text x="40" y="58" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#697078" font-weight="400">Common practical convention: reflect pitch classes across the midpoint between tonic C and dominant G.</text><line x1="380.0" y1="125.0" x2="252.50000000000006" y2="600.8364779650319" stroke="#d6d5d0" stroke-width="1.4"/><line x1="507.5" y1="159.16352203496817" x2="380.0" y2="635.0" stroke="#d6d5d0" stroke-width="1.4"/><line x1="600.8364779650319" y1="252.5" x2="507.5" y2="600.8364779650318" stroke="#d6d5d0" stroke-width="1.4"/><line x1="635.0" y1="380.0" x2="600.8364779650319" y2="507.5" stroke="#d6d5d0" stroke-width="1.4"/><line x1="159.16352203496814" y1="507.5" x2="252.4999999999999" y2="159.16352203496822" stroke="#d6d5d0" stroke-width="1.4"/><line x1="125.0" y1="380.00000000000006" x2="159.16352203496817" y2="252.49999999999997" stroke="#d6d5d0" stroke-width="1.4"/><line x1="72.11114287035946" y1="297.5014293735715" x2="687.8888571296405" y2="462.4985706264285" stroke="#c76535" stroke-width="4"/><circle cx="380.0" cy="125.0" r="28" fill="white" stroke="#25282c" stroke-width="1.2"/><text x="380.0" y="130.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#25282c" font-weight="700">C</text><circle cx="507.5" cy="159.16352203496817" r="28" fill="white" stroke="#25282c" stroke-width="1.2"/><text x="507.5" y="164.16352203496817" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#25282c" font-weight="700">C#</text><circle cx="600.8364779650319" cy="252.5" r="28" fill="white" stroke="#25282c" stroke-width="1.2"/><text x="600.8364779650319" y="257.5" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#25282c" font-weight="700">D</text><circle cx="635.0"