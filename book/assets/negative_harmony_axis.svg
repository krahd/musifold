l="#25282c" font-weight="700">A#</text><circle cx="252.4999999999999" cy="159.16352203496822" r="28" fill="white" stroke="#25282c" stroke-width="1.2"/><text x="252.4999999999999" y="164.16352203496822" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#25282c" font-weight="700">B</text><text x="380" y="372" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" fill="#25282c" font-weight="700">N(p) = 7 - p</text><text x="380" y="397" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#697078" font-weight="400">mod 12, for tonic C</text><text x="380" y="423" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#697078" font-weight="400">C↔G  D↔F  E↔Eb</text><text x="380" y="443" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#697078" font-weight="400">A↔Bb  B↔Ab  C#↔F#</text>
